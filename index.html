<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>確認用ページ　2つの案</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#ffffff;color:#2d3742;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:24px;line-height:1.5;margin:0 0 6px}
.lead{margin:0 0 22px}
.choices{display:grid;gap:18px}
.choice{display:block;text-decoration:none;color:inherit;border:2px solid #2d3742;border-radius:16px;overflow:hidden;background:#fff}
.choice img{display:block;width:100%;height:auto;aspect-ratio:16 / 9;object-fit:cover;background:#e9eef2}
.choice-t{display:block;padding:14px 16px 16px}
.choice-name{display:block;font-size:22px;font-weight:700;line-height:1.5}
.choice-note{display:block;font-size:16px}
.choice:hover,.choice:focus-visible{border-color:#166534;outline:none;box-shadow:0 0 0 3px rgba(22,101,52,.25)}
@media (min-width:768px){.choices{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<h1>確認用ページ　2つの案</h1>
<p class="lead">中身は同じで、最初の画面（ファーストビュー）の見た目だけが違う2つのページです。それぞれ開いてご覧ください。</p>
<div class="choices">
<a class="choice" href="a/index.html"><img src="images/thumb_a.jpg" alt="A案の最初の画面" width="640" height="360"><span class="choice-t"><span class="choice-name">A案　写真が切り替わる・旧LPに近い</span><span class="choice-note">今までのLPと同じく、女性の写真が数秒ごとに切り替わる形です</span></span></a>
<a class="choice" href="b/index.html"><img src="images/thumb_b.jpg" alt="B案の最初の画面" width="640" height="360"><span class="choice-t"><span class="choice-name">B案　写真1枚・落ち着いた印象</span><span class="choice-note">明るい個室の写真1枚に明朝体の見出しを重ねた、動きのない形です</span></span></a>
</div>
</div></body>
</html>
